# ukrainealarm.com: the official API of the "Повітряна тривога" app.
# Region level down to hromada, with alert types.
# Put the API key (request form on https://api.ukrainealarm.com) in the
# environment variable UKRAINEALARM_API_KEY.
[source]
type = "ukrainealarm"
poll_interval_s = 1           # each poll fetches only lastActionIndex (38 bytes)
backoff_max_s = 60
stale_after_s = 180

[source.vars]
region_id = "332"             # м. Дніпро та Дніпровська ТГ; GET /api/v3/regions lists all ids
district_id = "44"            # its district (an alert there covers the city)
oblast_id = "9"               # its oblast; alerts elsewhere in it give "partial"

# [source.change_marker]
# max_age_s = 300             # a full request at least this often, even with no change
