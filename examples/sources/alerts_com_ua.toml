# alerts.com.ua: oblast level, no key. Warning: on 2026-11-08 its public data
# was frozen (last_update > 30 h old). Prefer the official `ukrainealarm` source.
[source]
type = "alerts_com_ua"
poll_interval_s = 15
backoff_max_s = 300
stale_after_s = 180

[source.vars]
state_id = "0"                # the oblast id of this API: GET https://alerts.com.ua/api/states lists them
