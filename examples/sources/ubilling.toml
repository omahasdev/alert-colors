# ubilling: no token, oblast level only. config.toml uses it as the last backup
# ([[failover.sources]]). Use this block only to make it [source].
[source]
type = "ubilling"
poll_interval_s = 1
backoff_max_s = 60
stale_after_s = 180

[source.vars]
oblast_name = "Київська область"   # setup.cmd region writes it
