[project]
name = "alert-colors"
version = "0.2.0"
description = "Show air-raid alert status of a Ukrainian region with PC RGB lighting (ASUS Aura, Razer Chroma)"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["jmespath==1.1.0", "pywin32==312; sys_platform == 'win32'", "tzdata==2026.6; sys_platform == 'win32'"]

[project.scripts]
alert-colors = "alert_colors.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alert_colors = ["tuner.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
